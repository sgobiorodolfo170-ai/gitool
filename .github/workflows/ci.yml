name: CI

on:
  push:
    branches: [main]
  pull_request:

# 目标：让「这次改动有没有破坏东西」变成一条可机器判定的信号。
# 三个门禁都是确定性的：类型检查、单测、构建产物。
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: 类型检查（渲染层 + 主进程）
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 构建产物
        run: npm run build
