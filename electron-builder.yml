appId: com.gitool.desktop
productName: Gitool
copyright: Copyright © 2026 Gitool

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  # node_modules 不列出：electron-builder 始终用自带生产依赖收集器只拷
  # dependencies。v0.7.6 实测（npm run dist）：显式列出与否 asar 内容逐条
  # 一致（4484 条目）、devDependencies 零混入，此行纯属冗余，勿加回。
  - package.json
  - build/icon.png

asar: true
# P-26（SEC-16）：只外置确需的原生模块。原先 `**/*.node` 把整棵原生树暴露在
# app.asar.unpacked（用户可写目录），任何本地低权限进程都能替换 .node 注入
# 恶意原生库；@napi-rs/keyring 是本项目唯一原生依赖，收窄后其余 .node
# （即使未来新增依赖）默认留在 asar 内。
asarUnpack:
  - "**/@napi-rs/keyring/**"

npmRebuild: false
nodeGypRebuild: false

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Gitool
